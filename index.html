<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Habit & Goal Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                  url('https://images.unsplash.com/photo-1610348725531-843dff563e2c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D') center/cover no-repeat fixed;
      color: #fff;
      padding: 10px;
      transition: background-image 0.5s ease-in-out;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 18px 14px 12px 14px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      width: 100%;
    }

    .tab-btn {
      padding: 10px 2px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    button.add-btn {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #ff4757;
      color: #fff;
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    button.add-btn:hover {
      background: #ff6b81;
    }

    .task-list {
      list-style: none;
      min-height: 40px;
      width: 100%;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.12);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      transition: background 0.3s ease, transform 0.2s ease;
      cursor: grab;
      user-select: none;
      width: 100%;
      gap: 8px;
    }

    .task-item:active {
      cursor: grabbing;
    }

    .task-item.dragging {
      opacity: 0.4;
      border: 2px dashed rgba(255, 255, 255, 0.6);
    }

    .task-item.completed {
      background: rgba(46, 213, 115, 0.25);
      text-decoration: line-through;
      opacity: 0.75;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .drag-handle {
      cursor: grab;
      font-size: 1.1rem;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #2ed573;
      flex-shrink: 0;
    }

    .task-left span {
      overflow-wrap: anywhere;
      font-size: 0.92rem;
    }

    .action-btns {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .move-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      border-radius: 6px;
      width: 24px;
      height: 24px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff6b81;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      margin-left: 2px;
    }

    .empty-info {
      text-align: center;
      opacity: 0.7;
      font-style: italic;
      padding: 15px 0;
      font-size: 0.88rem;
    }

    .footer {
      text-align: center;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      opacity: 0.75;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 id="currentDate">Datum</h1>
      <p id="subTitle">Tägliches Tracking</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchCategory('supplemente', this)">💊 Supps</button>
      <button class="tab-btn" onclick="switchCategory('fitness', this)">🏋️ Fitness</button>
      <button class="tab-btn" onclick="switchCategory('lifestyle', this)">🌿 Lifestyle</button>
    </div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Eintrag hinzufügen...">
      <button class="add-btn" onclick="addTask()">Hinzufügen</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="footer">
      BRS - Bähringer Reallife Solutions
    </div>
  </div>

  <script>
    const backgrounds = {
      supplemente: 'https://images.unsplash.com/photo-1610348725531-843dff563e2c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D',
      fitness: 'https://images.unsplash.com/photo-1733077151425-67af89045a9f?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D',
      lifestyle: 'https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1920&q=80'
    };

    let activeCategory = 'supplemente';

    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const today = new Date();
    document.getElementById('currentDate').textContent = today.toLocaleDateString('de-DE', options);

    let allData = JSON.parse(localStorage.getItem('multiHabitData')) || {
      supplemente: [],
      fitness: [],
      lifestyle: []
    };

    const todayStr = today.toDateString();
    let lastResetDate = localStorage.getItem('lastResetDate');

    if (lastResetDate !== todayStr) {
      for (let cat in allData) {
        allData[cat] = allData[cat].map(item => ({ ...item, completed: false }));
      }
      localStorage.setItem('multiHabitData', JSON.stringify(allData));
      localStorage.setItem('lastResetDate', todayStr);
    }

    function saveData() {
      localStorage.setItem('multiHabitData', JSON.stringify(allData));
    }

    function updateBackground() {
      document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('${backgrounds[activeCategory]}')`;
    }

    function switchCategory(category, btnElement) {
      activeCategory = category;
      
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      }

      updateBackground();
      renderTasks();
    }

    function renderTasks() {
      const taskList = document.getElementById('taskList');
      taskList.innerHTML = '';
      const currentList = allData[activeCategory] || [];

      if (currentList.length === 0) {
        taskList.innerHTML = '<li class="empty-info">Keine Einträge vorhanden</li>';
        return;
      }

      currentList.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.setAttribute('draggable', 'true');
        li.dataset.index = index;

        li.innerHTML = `
          <div class="task-left">
            <span class="drag-handle">⋮⋮</span>
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
            <span>${task.text}</span>
          </div>
          <div class="action-btns">
            <button class="move-btn" onclick="moveTask(${index}, -1)" title="Nach oben">▲</button>
            <button class="move-btn" onclick="moveTask(${index}, 1)" title="Nach unten">▼</button>
            <button class="delete-btn" onclick="deleteTask(${index})" title="Löschen">&times;</button>
          </div>
        `;

        li.addEventListener('dragstart', handleDragStart);
        li.addEventListener('dragover', handleDragOver);
        li.addEventListener('drop', handleDrop);
        li.addEventListener('dragend', handleDragEnd);

        taskList.appendChild(li);
      });
    }

    let dragIndex = null;

    function handleDragStart(e) {
      dragIndex = +this.dataset.index;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e) {
      e.preventDefault();
      const targetIndex = +this.dataset.index;

      if (dragIndex !== null && dragIndex !== targetIndex) {
        const movedItem = allData[activeCategory].splice(dragIndex, 1)[0];
        allData[activeCategory].splice(targetIndex, 0, movedItem);
        saveData();
        renderTasks();
      }
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
      dragIndex = null;
    }

    function moveTask(index, direction) {
      const newIndex = index + direction;
      const list = allData[activeCategory];
      if (newIndex >= 0 && newIndex < list.length) {
        const item = list.splice(index, 1)[0];
        list.splice(newIndex, 0, item);
        saveData();
        renderTasks();
      }
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      
      if (text !== '') {
        if (!allData[activeCategory]) allData[activeCategory] = [];
        allData[activeCategory].push({ text: text, completed: false });
        input.value = '';
        saveData();
        renderTasks();
      }
    }

    function toggleTask(index) {
      allData[activeCategory][index].completed = !allData[activeCategory][index].completed;
      saveData();
      renderTasks();
    }

    function deleteTask(index) {
      allData[activeCategory].splice(index, 1);
      saveData();
      renderTasks();
    }

    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    updateBackground();
    renderTasks();
  </script>
</body>
</html>
